name: build-tomyongji-ios-app

on:
  push:
    branches:
      - main
      - develop

jobs:
  # develop 브랜치 전용 TestFlight 배포 작업
  beta:
    name: TestFlight Deploy
    runs-on: macos-15
    # develop 브랜치에 push될 때만 실행되도록 조건을 설정
    if: github.ref == 'refs/heads/develop' && !startsWith(github.event.head_commit.message, '[fastlane]')
    steps:
      # 5분짜리 빌드를 돌린 뒤 자격 정보 문제를 알아채는 걸 막기 위해 가장 먼저 검사한다.
      - name: Verify Required Secrets
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          missing=()
          for name in MATCH_PASSWORD KEYCHAIN_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID \
                      APP_STORE_CONNECT_API_KEY_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::필수 시크릿이 비어 있습니다: ${missing[*]}"
            exit 1
          fi
          echo "필수 시크릿 6개 확인 완료"

      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install Tuist CLI
        run: brew install tuist

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Tuist Generate
        run: tuist generate

      - name: Deploy to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          # fastlane 업데이트 안내가 40여 줄씩 출력돼 실제 에러를 로그에서 밀어내는 걸 막는다.
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        run: bundle exec fastlane ios beta

  # main 브랜치 전용 App Store 배포 작업
  release:
    name: App Store Deploy
    runs-on: macos-15
    # main 브랜치에 push될 때만 실행되도록 조건을 설정
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, '[fastlane]')
    steps:
      # 5분짜리 빌드를 돌린 뒤 자격 정보 문제를 알아채는 걸 막기 위해 가장 먼저 검사한다.
      - name: Verify Required Secrets
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          missing=()
          for name in MATCH_PASSWORD KEYCHAIN_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID \
                      APP_STORE_CONNECT_API_KEY_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::필수 시크릿이 비어 있습니다: ${missing[*]}"
            exit 1
          fi
          echo "필수 시크릿 6개 확인 완료"

      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install Tuist CLI
        run: brew install tuist

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Tuist Generate
        run: tuist generate

      - name: Deploy to App Store
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          # fastlane 업데이트 안내가 40여 줄씩 출력돼 실제 에러를 로그에서 밀어내는 걸 막는다.
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        # 'beta' lane 대신 'release' lane을 호출
        run: bundle exec fastlane ios release